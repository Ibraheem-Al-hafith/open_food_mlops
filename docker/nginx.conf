events {}

http {
    # Upgrade to WebSocket only when the client asks for it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream fastapi {
        server fastapi:8000;
    }

    upstream mlflow {
        server mlflow:5000;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream ui {
        server ui:7860;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://fastapi/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mlflow/ {
            proxy_pass http://mlflow/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gradio UI (served with UI_ROOT_PATH=/ui). The trailing slash on
        # proxy_pass strips the /ui prefix before the request reaches Gradio.
        location = /ui {
            return 301 /ui/;
        }

        location /ui/ {
            client_max_body_size 25m;      # batch uploads (default is only 1m)

            proxy_pass http://ui/;
            proxy_http_version 1.1;
            proxy_buffering off;           # keep progress / streaming responsive
            proxy_read_timeout 300s;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
