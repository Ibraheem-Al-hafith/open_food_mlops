services:

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    ports:
      - "1051:8000"
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PUSHGATEWAY_URL: http://pushgateway:9091
    volumes:
      - ./data/production:/app/data/production
    depends_on:
      mlflow:
        condition: service_healthy
      pushgateway:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "1050:5000"
    volumes:
      # 1. Mount the parent directory instead of the specific file
      - ./mlflow:/mlflow
    # 2. Add an entrypoint to auto-fix the directory-to-file mismatch
    # entrypoint: ["/bin/sh", "-c", "if [ -d /mlflow/mlflow.db ]; then rm -rf /mlflow/mlflow.db; fi; touch /mlflow/mlflow.db; mkdir -p /mlflow/mlruns; exec \"$@\"", "--"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    ports:
      - "1603:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      fastapi:
        condition: service_healthy
      pushgateway:
        condition: service_started

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "1604:9091"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "1053:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
  nginx:
    image:  nginx:alpine
    container_name: nginx
    ports:
      - "1606:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      fastapi:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      grafana:
        condition: service_started

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PUSHGATEWAY_URL: http://pushgateway:9091
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ./data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
      pushgateway:
        condition: service_started
      prefect-server:
        condition: service_healthy

  prefect-server:
    image: prefecthq/prefect:3.8.6-python3.12
    container_name: open_food_mlops-prefect-server
    ports:
      - "127.0.0.1:1607:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////root/.prefect/prefect.db
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: 4200
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes:
      - prefect_data:/root/.prefect
    command:
      [
        "prefect",
        "server",
        "start",
        "--host",
        "0.0.0.0",
        "--port",
        "4200"
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  prefect-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    container_name: open_food_mlops-prefect-worker
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PUSHGATEWAY_URL: http://pushgateway:9091
    volumes:
      - ./data:/app/data
    depends_on:
      prefect-server:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      pushgateway:
        condition: service_started
    command:
      [
        "prefect",
        "worker",
        "start",
        "--pool",
        "open-food-mlops",
        "--type",
        "process",
        "--limit",
        "1"
      ]
    restart: unless-stopped
volumes:
  grafana_data:
  prometheus_data:
  prefect_data:
